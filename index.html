<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend 1.0 — отправка данных на бэкенд</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 { font-size: 22px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 10px 18px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1e4fbf; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      min-height: 20px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .ok { color: #15803d; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Отправка текста на сервер</h1>

  <input id="textInput" type="text" placeholder="Введите текст..." />
  <button id="sendBtn">Отправить</button>
  <p id="status"></p>

  <script>
    const API_URL = "http://127.0.0.1:5000/submit";

    const input  = document.getElementById("textInput");
    const button = document.getElementById("sendBtn");
    const status = document.getElementById("status");

    function setStatus(message, kind = "") {
      status.textContent = message;
      status.className = kind; // "ok" | "err" | ""
    }

    async function sendText() {
      const text = input.value.trim();

      // Проверка: пустое поле — запрос не отправляем
      if (text === "") {
        setStatus("Введите текст!", "err");
        return;
      }

      button.disabled = true;
      setStatus("Отправка...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        if (!response.ok) {
          throw new Error(`Сервер вернул ${response.status}`);
        }

        const data = await response.json();

        // Ожидаем { received: "...", status: "ok" }
        setStatus(JSON.stringify(data), "ok");
        input.value = "";
        input.focus();
      } catch (err) {
        setStatus(`Ошибка: не удалось отправить данные (${err.message})`, "err");
      } finally {
        button.disabled = false;
      }
    }

    button.addEventListener("click", sendText);

    // Бонус: Enter в поле — тоже отправить
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendText();
    });
  </script>
</body>
</html>
